# FlashDrop API — Docker Compose Infrastructure
# Prompt 9:  Redis added
# Prompt 29: RabbitMQ added
# Note: PostgreSQL is running externally/locally and managed via pgAdmin.

services:

  # ──────────────────────────────────────────────────────────
  # REDIS — In-memory cache for Product Catalog
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flashdrop-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # RABBITMQ — Message Broker for Events
  # ──────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: flashdrop-rabbitmq
    ports:
      # AMQP protocol port — your .NET app connects here to publish/consume
      - "5672:5672"
      # Management UI — open http://localhost:15672 in browser
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped